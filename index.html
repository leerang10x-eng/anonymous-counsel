<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>익명 상담</title>
</head>

<body>
  <h1>익명 상담</h1>

  <p>상담을 시작하려면 입장 코드를 입력해주세요.</p>

  <input
    type="text"
    id="roomCode"
    placeholder="입장 코드"
    autocomplete="off"
  >

  <button id="enterButton">상담 시작</button>

  <p id="message"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
